spring.application.name=TCGstore

server.port=${PORT:8080}

# --- Cognito (JWT) ---
# Sin valores por defecto: si falta alguna variable, la app no arranca (mejor que arrancar mal configurada).
# Ejemplo issuer: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX
app.cognito.issuer-uri=${COGNITO_ISSUER_URI}
app.cognito.client-id=${COGNITO_CLIENT_ID}

# --- Secreto compartido con el API Gateway (cabecera X-Secret-Gateway) ---
app.gateway.secret=${API_GATEWAY_SECRET}

# --- Base de datos (Supabase) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- SNS (módulo informes) ---
# Región, credenciales y endpoint los toma el SDK del entorno (AWS_REGION, rol de EC2, AWS_ENDPOINT_URL en local).
app.sns.topic-arn=${SNS_TOPIC_ARN:}

logging.level.root=INFO
