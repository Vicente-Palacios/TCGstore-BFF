spring.application.name=TCGstore

server.port=${PORT:8080}

app.public-host=${PUBLIC_HOST_URL:http://localhost:8080}


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_8UDdDr2x9
app.gateway.secret=${API_GATEWAY_SECRET:secreto_local}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- SNS (módulo informes) ---
# Región, credenciales y endpoint los toma el SDK del entorno (AWS_REGION, rol de EC2, AWS_ENDPOINT_URL en local).
app.sns.topic-arn=${SNS_TOPIC_ARN:}
